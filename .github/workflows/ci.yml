name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  container:
    uses: ./.github/workflows/_container.yml
    with:
      # There are no tests; the Dockerfile carries its own build-time
      # assertions instead. Publishing still only happens on a tag.
      publish: true
    permissions:
      contents: read
      packages: write

  docs:
    uses: ./.github/workflows/_docs.yml

  release:
    needs: [container, docs]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
